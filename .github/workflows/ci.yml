name: ci

# 三平台 × Node 24 × 零依赖。这一份只管「不需要宿主的那批自检」——
# DSH 宿主契约（verify.mjs）与本机流程备份（doctor.mjs 的备份段）在 runner 上不存在，
# 硬跑只会把「环境没有」当成「代码坏了」。那两支由工程机上的 check-all 管。
#
# 复用：release.yml 用 `uses: ./.github/workflows/ci.yml` 等这一份跑完才发版
# （「全绿才发版」就是这个 needs）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 报环境（三平台同一个口径）
        shell: bash
        run: |
          node -v
          node -p "process.platform + ' ' + process.arch"

      - name: 零依赖：仓库里没有 dependencies，也没有 install 脚本
        shell: bash
        run: |
          node -e "const p=require('./package.json');const d=Object.keys(p.dependencies??{});const s=p.scripts??{};console.log('dependencies:',d.length,'install-script:',Object.keys(s).filter(k=>k==='install'||k==='postinstall').length);if(d.length||s.install||s.postinstall)process.exit(1)"

      - name: 两个仓库名的可达性（当前名必须活；改名目标允许还没生效）
        shell: bash
        run: |
          set -euo pipefail
          owner=hanhan9999999999999999999
          cur="https://github.com/$owner/dsh-macro-memory"
          nxt="https://github.com/$owner/macro-memory"
          code_of() { curl -s -o /dev/null -w '%{http_code}' -I --max-time 20 "$1" || echo 000; }

          c=$(code_of "$cur")
          n=$(code_of "$nxt")
          echo "当前名 $cur → $c"
          echo "改名目标 $nxt → $n"

          case "$c" in
            200|301|302) ;;
            *) echo "::error::当前仓库名解析不了（$c）——仓库没了，或改名把两边都改坏了"; exit 1 ;;
          esac

          case "$n" in
            200|301|302)
              echo "::notice::改名目标已生效（$n）"
              case "$c" in
                301|302) echo "::notice::旧名 301 跟随正常，历史链接不会 404" ;;
                *) echo "::warning::新名已生效但当前名还是 $c（不是 301）——历史链接可能断，检查 GitHub 改名是否真的发生在这一侧" ;;
              esac
              ;;
            404)
              echo "::notice::改名目标 $nxt 还是 404：P2-3 的 remote 改名还没做（工具与文档已就位：tools/rename-brand.mjs）。这一条在改名之前不判红——判据只钉「两个名字不许同时死」。"
              ;;
            *)
              echo "::error::改名目标返回 $n（既不是 404，也不是 200/301/302）——网络或权限问题，别当成改名已完成"; exit 1 ;;
          esac

      - name: 不需要宿主的那批自检
        shell: bash
        run: |
          node tools/check-all.mjs --only=probe-core,probe-fence,probe-rrf,probe-share,probe-mcp,probe-dual,probe-homebrew,probe-platform,probe-tools,probe-monotone

      - name: 单文件二进制（mac 上要先 codesign --remove-signature，见 docs/INTERNAL.md 9.289）
        if: runner.os != 'macOS'
        shell: bash
        run: node tools/probe-sea.mjs

      - name: 失败时把日志带走
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            **/*.log
            tools/baselines.json
          if-no-files-found: ignore
          retention-days: 7
